name: Publish QNAP images
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-qnap.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency: publish-qnap
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --platform linux/amd64 --file core/Dockerfile \
            --build-arg NPM_REGISTRY=https://registry.npmjs.org \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$image:$GITHUB_SHA" --tag "$image:latest" .
      - name: Build NapCat image
        run: |
          archive=napcat-docker-v4.18.42-amd64.tar
          release=https://github.com/XingYunStar/NapCatQQ/releases/download/v4.18.42
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" "$release/$archive"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive.sha256" "$release/$archive.sha256"
          (cd "$RUNNER_TEMP" && sha256sum -c "$archive.sha256")

          expected_id=sha256:039f78c89e67e0403d9cf11f7acda1ace7cf9564456c5db65ba67aa1f52fce7e
          docker load -i "$RUNNER_TEMP/$archive"
          actual=$(docker image inspect "$expected_id" --format '{{.Id}} {{.Os}}/{{.Architecture}}')
          test "$actual" = "$expected_id linux/amd64"
          base_image=qq-farm-napcat-base:v4.18.42
          docker tag "$expected_id" "$base_image"
          image="ghcr.io/${GITHUB_REPOSITORY,,}-napcat"
          docker build --platform linux/amd64 --file napcat/Dockerfile \
            --build-arg NAPCAT_IMAGE="$base_image" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$image:$GITHUB_SHA" --tag "$image:latest" .
      - name: Publish images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$image:$GITHUB_SHA"
          docker push "$image-napcat:$GITHUB_SHA"
          docker push "$image:latest"
          docker push "$image-napcat:latest"
